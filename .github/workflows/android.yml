name: Nexauren File Android

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag para criar uma GitHub Release, por exemplo v1.0.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create signing file
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/nexauren-release.jks"

      - name: Build Release APK with persistent signing
        if: env.HAS_SIGNING == 'true'
        run: gradle :app:assembleRelease
        env:
          NEXAUREN_KEYSTORE_PATH: ${{ github.workspace }}/nexauren-release.jks
          NEXAUREN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXAUREN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXAUREN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Release APK with temporary debug signing
        if: env.HAS_SIGNING != 'true'
        run: gradle :app:assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexauren-file-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Publish manually requested GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG"             app/build/outputs/apk/release/app-release.apk             --title "Nexauren File $RELEASE_TAG"             --generate-notes
